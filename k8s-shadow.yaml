
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aceest-fitness-shadow
spec:
  replicas: 1
  selector:
    matchLabels:
      app: aceest-fitness-shadow
  template:
    metadata:
      labels:
        app: aceest-fitness-shadow
        track: shadow
    spec:
      containers:
        - name: aceest-fitness
          image: 2025tm93116/aceest-fitness:1.0-7
          imagePullPolicy: Always
          ports:
            - containerPort: 5000
---
apiVersion: v1
kind: Service
metadata:
  name: aceest-shadow
spec:
  type: ClusterIP
  selector:
    app: aceest-fitness-shadow
  ports:
    - port: 5000
      targetPort: 5000